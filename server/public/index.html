<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twilio Dialer Web App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            text-align: center;
            padding: 40px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .logo {
            width: 150px;
            height: 150px;
            margin-bottom: 30px;
        }
        .btn-primary {
            background-color: #F22F46;
            border-color: #F22F46;
            padding: 10px 30px;
            font-size: 18px;
            margin-top: 20px;
        }
        .btn-primary:hover {
            background-color: #D81F3D;
            border-color: #D81F3D;
        }
    </style>
</head>
<body>
    <div class="container">
        <img class="logo" src="https://www.twilio.com/assets/icons/twilio-icon-512.png" alt="Twilio Logo">
        <h1 class="display-4">Twilio Dialer Web App</h1>
        <p class="lead">A web-based call center application powered by Twilio</p>
        <hr class="my-4">
        <p>Log in to access the dialer, manage your call queue, and view call history.</p>
        <a class="btn btn-primary btn-lg" href="/login.html" role="button">Login</a>
    </div>

    <script>
        // Check if user is already logged in
        document.addEventListener('DOMContentLoaded', function() {
            const token = localStorage.getItem('token');
            const userJson = localStorage.getItem('user');
            
            if (token && userJson) {
                try {
                    const user = JSON.parse(userJson);
                    
                    // Redirect based on role
                    if (user.role === 'admin') {
                        window.location.href = '/admin.html';
                    } else {
                        window.location.href = '/dashboard.html';
                    }
                } catch (error) {
                    console.error('Error parsing user data:', error);
                    // Clear invalid data
                    localStorage.removeItem('token');
                    localStorage.removeItem('user');
                }
            }
        });
    </script>
</body>
</html>
